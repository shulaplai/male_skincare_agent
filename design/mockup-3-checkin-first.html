<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SkinCoach — 方向三：每日 check-in 引導</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f7f1e6; --cream2:#efe6d3; --forest:#1f3d2b; --forest2:#2c5238;
    --terracotta:#c97b5a; --sand:#d9c8a8; --ink:#2a2318; --muted:#8a7d68;
    --serif:'Newsreader',serif; --sans:'Work Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--cream);color:var(--ink);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;
    background-image:radial-gradient(900px 500px at 50% -10%, rgba(201,123,90,.12), transparent 60%)}
  .topbar{width:100%;max-width:720px;display:flex;align-items:center;justify-content:space-between;padding:26px 20px 10px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .leaf{width:32px;height:32px;border-radius:50% 50% 50% 8px;background:var(--forest);position:relative}
  .brand .leaf::after{content:'';position:absolute;width:8px;height:16px;background:var(--cream);border-radius:0 8px 0 0;left:12px;top:10px}
  .brand b{font-family:var(--serif);font-weight:600;font-size:22px}
  .topbar .day{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:15px}

  .stage{width:100%;max-width:720px;padding:6px 24px 60px}
  .steps{display:flex;justify-content:center;gap:10px;margin:10px 0 30px}
  .steps .st{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
  .steps .st i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:600;font-size:13px;background:transparent;border:1.5px solid var(--sand);color:var(--muted);transition:.2s}
  .steps .st span{font-size:11px;color:var(--muted)}
  .steps .st.done i{background:var(--forest);border-color:var(--forest);color:var(--cream)}
  .steps .st.active i{border-color:var(--forest);color:var(--forest);box-shadow:0 0 0 4px rgba(31,61,43,.12)}
  .steps .st.active span{color:var(--forest);font-weight:600}
  .steps .bar{flex:0 0 40px;height:2px;background:var(--sand);align-self:center;margin-top:-24px}

  .card{background:#fffdf7;border:1px solid var(--sand);border-radius:22px;padding:34px 34px;box-shadow:0 18px 50px -22px rgba(42,35,24,.25)}
  .card h2{font-family:var(--serif);font-weight:500;font-size:30px;margin-bottom:6px}
  .card .hint{color:var(--muted);font-size:14.5px;margin-bottom:24px;line-height:1.6}
  .card .hint b{color:var(--forest);font-weight:600}

  .upload{border:2px dashed var(--sand);border-radius:16px;padding:34px;text-align:center;cursor:pointer;background:var(--cream);transition:.2s}
  .upload:hover{border-color:var(--terracotta)}
  .upload .cam{font-size:40px;display:block;margin-bottom:8px}
  .upload p{font-weight:600;font-size:15px}
  .upload span{font-size:12px;color:var(--muted)}

  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{border:1.5px solid var(--sand);border-radius:30px;padding:11px 18px;font-size:14px;cursor:pointer;background:var(--cream);transition:.15s}
  .chip.sel{background:var(--forest);color:var(--cream);border-color:var(--forest)}
  .severity{margin-top:24px}
  .severity .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}
  .slider{width:100%;appearance:none;height:6px;border-radius:6px;background:var(--sand);outline:none}
  .slider::-webkit-slider-thumb{appearance:none;width:24px;height:24px;border-radius:50%;background:var(--terracotta);border:3px solid var(--cream);cursor:pointer}

  .tags{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}
  .tag{background:var(--cream);border:1px solid var(--sand);border-radius:10px;padding:9px 14px;font-size:13.5px;display:flex;gap:8px;align-items:center}
  .tag i{font-style:normal;cursor:pointer;color:var(--muted);font-weight:600}
  .add{width:100%;border:1.5px dashed var(--sand);border-radius:12px;padding:12px;font-size:14px;font-family:var(--sans);background:transparent;color:var(--ink);outline:none}

  .products{display:flex;flex-direction:column;gap:10px}
  .product{display:flex;align-items:center;gap:13px;border:1px solid var(--sand);border-radius:14px;padding:13px 16px;background:var(--cream)}
  .product .tick{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--sand);display:grid;place-items:center;font-size:13px;color:transparent}
  .product.on .tick{background:var(--forest);border-color:var(--forest);color:var(--cream)}
  .product .name{font-weight:600;font-size:14.5px}
  .product .meta{font-size:12px;color:var(--muted);margin-top:1px}

  .navrow{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
  .btn{border:1.5px solid var(--forest);border-radius:30px;padding:14px 26px;font-family:var(--sans);font-weight:600;font-size:15px;cursor:pointer;transition:.15s}
  .btn.back{background:transparent;color:var(--forest)}
  .btn.next{background:var(--forest);color:var(--cream)}
  .btn.next:hover{background:var(--forest2)}
  .btn:disabled{opacity:.35;cursor:not-allowed}

  /* result */
  .result{text-align:center}
  .result .emoji{font-size:52px;margin-bottom:10px}
  .result h2{margin-bottom:8px}
  .result .scoreline{font-family:var(--serif);font-size:18px;color:var(--terracotta);margin-bottom:22px}
  .insights{text-align:left;display:flex;flex-direction:column;gap:11px;margin-bottom:20px}
  .insight{display:flex;gap:12px;background:var(--cream);border-radius:14px;padding:15px 16px;border:1px solid var(--sand)}
  .insight .n{font-family:var(--serif);font-weight:600;font-size:18px;color:var(--terracotta);flex:none}
  .insight .t{font-size:14px;line-height:1.5}.insight .t b{color:var(--forest)}
  @media(max-width:520px){.card{padding:26px 20px}}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="leaf"></span><b>SkinCoach</b></div>
    <div class="day">12 月 14 日 · 星期六</div>
  </div>

  <div class="stage">
    <div class="steps" id="steps">
      <div class="st active"><i>1</i><span>影相</span></div><div class="bar"></div>
      <div class="st"><i>2</i><span>狀態</span></div><div class="bar"></div>
      <div class="st"><i>3</i><span>飲食</span></div><div class="bar"></div>
      <div class="st"><i>4</i><span>產品</span></div><div class="bar"></div>
      <div class="st"><i>5</i><span>分析</span></div>
    </div>

    <div class="card" id="card">
      <!-- Step 1 -->
      <section class="step">
        <h2>影一張素顏相</h2>
        <div class="hint">自然光、正面、唔開美顏。相會<b>先儲喺你部機</b>，你授權先會上雲分析。</div>
        <div class="upload"><span class="cam">📷</span><p>點擊影相 或 拖入相片</p><span>支援 JPG · 會自動壓縮到 1024px</span></div>
      </section>
    </div>

    <div class="navrow">
      <button class="btn back" disabled>上一步</button>
      <button class="btn next" id="next">下一步 →</button>
    </div>
  </div>

<script>
  const steps=[
    {title:'影一張素顏相',hint:'自然光、正面、唔開美顏。相會<b>先儲喺你部機</b>，你授權先會上雲分析。',html:'<div class="upload"><span class="cam">📷</span><p>點擊影相 或 拖入相片</p><span>支援 JPG · 會自動壓縮到 1024px</span></div>'},
    {title:'今日皮膚狀態點？',hint:'揀晒啱用嘅，可以揀多過一項。',html:'<div class="chips" id="chips"><span class="chip">泛紅</span><span class="chip">暗瘡</span><span class="chip">油光</span><span class="chip">乾燥</span><span class="chip">痕癢</span><span class="chip">冇異常</span></div><div class="severity"><div class="lbl"><span>輕微</span><span>嚴重</span></div><input class="slider" type="range" min="1" max="5" value="3"></div>'},
    {title:'噚日食咗啲咩？',hint:'尤其係辣、高糖、奶製品呢啲常見觸發位。',html:'<div class="tags"><span class="tag">打邊爐 · 辣底 <i>✕</i></span><span class="tag">凍檸茶 <i>✕</i></span></div><input class="add" placeholder="＋ 加入食物，例如：奶茶、炸雞…">'},
    {title:'呢 24 小時用咗咩產品？',hint:'撳一下揀，再撳一下取消。',html:'<div class="products"><div class="product on"><span class="tick">✓</span><div><div class="name">氨基酸潔面乳</div><div class="meta">早 · 晚</div></div></div><div class="product"><span class="tick">✓</span><div><div class="name">B5 保濕精華</div><div class="meta">早 · 晚</div></div></div><div class="product on"><span class="tick">✓</span><div><div class="name">水楊酸 toner</div><div class="meta">晚 · 新引入</div></div></div><div class="product"><span class="tick">✓</span><div><div class="name">防曬 SPF50</div><div class="meta">早</div></div></div></div>'},
    {title:'AI 分析完成 ✨',hint:'',html:'<div class="result"><div class="emoji">🌿</div><h2>今日分析結果</h2><div class="scoreline">皮膚指數 78 · 比昨日 +2</div><div class="insights"><div class="insight"><span class="n">01</span><div class="t"><b>油光 -18%</b> — 控油有進展，T 字位開始穩定。</div></div><div class="insight"><span class="n">02</span><div class="t"><b>下巴新暗瘡 +2</b> — 同你噚晚辣底＋新 toner 兩個變數有關。</div></div><div class="insight"><span class="n">03</span><div class="t"><b>建議</b> — 停 toner 3 日、今晚補水、未來 7 日避辣，之後再單一變數測試。</div></div></div></div>'}
  ];
  let cur=0;const card=document.getElementById('card'),next=document.getElementById('next');
  function render(){
    card.innerHTML='<section class="step"><h2>'+steps[cur].title+'</h2>'+(steps[cur].hint?'<div class="hint">'+steps[cur].hint+'</div>':'')+steps[cur].html+'</section>';
    document.querySelectorAll('.steps .st').forEach((s,i)=>{s.className='st'+(i<cur?' done':'')+(i===cur?' active':'')});
    next.textContent=cur===4?'完成 ✓':'下一步 →';
    if(cur===4){next.style.background='var(--terracotta)';next.style.borderColor='var(--terracotta)';}else{next.style.background='';next.style.borderColor='';}
    const chips=document.querySelectorAll('#chips .chip');
    chips.forEach(c=>c.addEventListener('click',()=>c.classList.toggle('sel')));
    document.querySelectorAll('.product').forEach(p=>p.addEventListener('click',()=>p.classList.toggle('on')));
  }
  next.addEventListener('click',()=>{if(cur<4){cur++;render();document.querySelector('.back').disabled=false;}else{next.textContent='已記錄 ✓';next.disabled=true;}});
  document.querySelector('.back').addEventListener('click',()=>{if(cur>0){cur--;render();if(cur===0)document.querySelector('.back').disabled=true;}});
  render();
</script>
</body>
</html>
