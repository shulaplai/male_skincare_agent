# SkinCoach SPA server: serves the built React app and reverse-proxies API
# calls to the backend compose service (`backend:8000`). The frontend code
# calls /api/... and /health (see frontend/src/api.ts).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Photos are uploaded as multipart/form-data — raise the 1 MB default cap.
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # All API traffic -> FastAPI. URI is passed through unchanged (/api/...).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Liveness / status endpoint the frontend pings (GET /health).
    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any non-file route serves index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
