[project]
name = "skincoach-backend"
version = "0.1.0"
description = "Local-first male skincare AI agent backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "httpx>=0.27",
    "pillow>=10.0",
    "pypdf>=4.0",
    "fastembed>=0.4",
    "python-multipart>=0.0.9",
    # Video → frames. `imageio-ffmpeg` ships a static ffmpeg binary in the wheel, so
    # there is no system ffmpeg to install (this machine has none). Chosen over
    # opencv-python-headless because frames are all we need — OpenCV's ~50MB wheel
    # would buy face detection we deliberately do not use yet.
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
