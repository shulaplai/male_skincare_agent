name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run eval harness (deterministic, golden corpus)
        # --fake = FakeLLM + hashing embedder: no network, no API key, stable
        # numbers from the committed eval/golden corpus. Exit non-zero on FAIL.
        run: python -m eval.run_eval --fake

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Stylelint
        run: npm run stylelint
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # The pixel baselines are macOS-only (`*-darwin.png`), so CI runs the part of
      # the UI gate that cannot drift by platform: axe (light + dark), interactions,
      # photo blur and consult streaming. `npm run ui:test` on a mac still compares
      # all 40 screenshots; `--ignore-snapshots` only skips those comparisons.
      - name: UI gate (a11y + interactions, no pixel snapshots)
        run: npx playwright test --ignore-snapshots
